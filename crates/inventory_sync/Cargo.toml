[package]
name = "inventory-manager-sync"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
libsql = "0.9"
uuid = { workspace = true }
common = { workspace = true }
inventory_security = { workspace = true }
inventory_security_macros = { workspace = true }
# Bundled Mozilla CA certificates for TLS on Android where the native
# cert store is not accessible via standard filesystem paths.
webpki-roots = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
tempfile = "3"

[lints]
workspace = true
