name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_VERSION: '1.0.0'
  JAVA_VERSION: '17'

jobs:
  build-fat-jar:
    name: Build Fat JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build fat JAR
        run: mvn clean package -DskipTests

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: target/chaoffice-${{ env.APP_VERSION }}-fat.jar
          retention-days: 1

  package:
    name: Package (${{ matrix.os-label }})
    needs: build-fat-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: Linux
            artifact-name: chaoffice-linux
            artifact-glob: 'target/installer/*'
          - os: windows-latest
            os-label: Windows
            artifact-name: chaoffice-windows
            artifact-glob: 'target/installer/*'
          - os: macos-latest
            os-label: macOS
            artifact-name: chaoffice-macos
            artifact-glob: 'target/installer/*'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download fat JAR
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: fat-jar

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p target/jpackage-input target/installer
          cp fat-jar/chaoffice-${{ env.APP_VERSION }}-fat.jar target/jpackage-input/chaoffice.jar

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --type deb \
            --name "chaoffice" \
            --app-version "${{ env.APP_VERSION }}" \
            --vendor "Chaos Office" \
            --description "Parts Inventory Management System" \
            --input target/jpackage-input \
            --main-jar chaoffice.jar \
            --main-class org.chaos.office.Launcher \
            --dest target/installer \
            --java-options "-Xmx512m" \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens=java.base/java.io=ALL-UNNAMED" \
            --java-options "--add-opens=java.base/java.util=ALL-UNNAMED" \
            --linux-shortcut \
            --linux-menu-group "Office" \
            --linux-app-category "Office"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --type exe `
            --name "ChaOffice" `
            --app-version "${{ env.APP_VERSION }}" `
            --vendor "Chaos Office" `
            --description "Parts Inventory Management System" `
            --input target/jpackage-input `
            --main-jar chaoffice.jar `
            --main-class org.chaos.office.Launcher `
            --dest target/installer `
            --java-options "-Xmx512m" `
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" `
            --java-options "--add-opens=java.base/java.io=ALL-UNNAMED" `
            --java-options "--add-opens=java.base/java.util=ALL-UNNAMED" `
            --win-dir-chooser `
            --win-shortcut `
            --win-shortcut-prompt `
            --win-menu `
            --win-menu-group "ChaOffice" `
            --win-per-user-install

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          jpackage \
            --type dmg \
            --name "ChaOffice" \
            --app-version "${{ env.APP_VERSION }}" \
            --vendor "Chaos Office" \
            --description "Parts Inventory Management System" \
            --input target/jpackage-input \
            --main-jar chaoffice.jar \
            --main-class org.chaos.office.Launcher \
            --dest target/installer \
            --java-options "-Xmx512m" \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens=java.base/java.io=ALL-UNNAMED" \
            --java-options "--add-opens=java.base/java.util=ALL-UNNAMED" \
            --java-options "-Dapple.awt.application.name=ChaOffice" \
            --mac-package-name "ChaOffice" \
            --mac-app-category "business"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          retention-days: 5

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp artifacts/chaoffice-linux/* release-assets/ 2>/dev/null || true
          cp artifacts/chaoffice-windows/* release-assets/ 2>/dev/null || true
          cp artifacts/chaoffice-macos/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChaOffice ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
